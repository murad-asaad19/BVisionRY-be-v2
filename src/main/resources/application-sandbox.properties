# Sandbox-lane profile (docker/sandbox lanes run SPRING_PROFILES_ACTIVE=
# dev,mock,sandbox). A DEDICATED profile on purpose: `mock` is also the
# documented local compose profile (docker-compose.yml api service), and
# relaxing security ceilings there would silently change what a developer
# verifies by hand. Nothing but the lanes opts into `sandbox`.
#
# Why these overrides exist: the e2e stack funnels every parallel Playwright
# browser context through the Next BFF, so this backend sees ONE client IP for
# the entire suite. Production-shaped per-IP ceilings then 429 full-suite runs
# in ways no real user population would produce: auth (10/min) failed the
# password-reset confirm mid-suite; accept (10/hr) starved the invite->accept
# helpers across consecutive runs; password-reset (5/hr, also keyed per email)
# capped suite runs per window. The limiters themselves stay verified by
# RateLimitServiceTest (including these three ceilings); no e2e spec asserts a
# 429 must occur. On lanes the windows live in the lane's own Redis (TTL keys
# that SURVIVE backend restarts; FLUSHALL on that Redis clears them) with an
# in-memory fallback when Redis is absent. Production and plain-dev are
# untouched: prod pins auth via ${RL_AUTH:10}; accept and password-reset have
# no properties entry anywhere and resolve from the @Value defaults in
# RateLimitService (10/hr, 5/hr).
bvisionry.rate-limit.auth.requests-per-minute=1000
bvisionry.rate-limit.accept.requests-per-hour=1000
bvisionry.rate-limit.password-reset.requests-per-hour=1000
