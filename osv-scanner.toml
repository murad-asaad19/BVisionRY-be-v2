# OSV-Scanner BASELINE — the supply-chain twin of the ArchUnit frozen store.
#
# Same contract as `src/test/resources/architecture/frozen-violations/`: this file
# is a RATCHET. It may shrink, never grow. Every id below is a vulnerability that
# was already in the resolved dependency tree when scanning was switched on, and
# every one of them is a debt, not an acquittal. A pull request that ADDS an id
# here is adding accepted risk and needs a reviewer who agrees with the risk —
# not a green pipeline.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY A BASELINE AND NOT A SEVERITY THRESHOLD
# ─────────────────────────────────────────────────────────────────────────────
# A severity gate was the first choice and it is not available here. Measured on
# the tree at the time this file was written (250 resolved packages):
#
#     80 findings / 67 distinct advisories across 26 packages
#     11 critical · 29 high · 32 medium · 7 low · 1 unscored
#
# There is no severity floor that is green today — `--fail-on-severity=critical`
# is red on eleven, including tomcat-embed-core (CVSS 9.8) and thymeleaf (9.0).
# Shipping a gate that is red on the day it lands does not make anyone safer; it
# teaches the team that this check is always red and therefore means nothing.
# That is the same reasoning that keeps e2e.yml on `workflow_dispatch` over in
# the web repo, and it applies with more force here because this gate BLOCKS.
#
# So the threshold is not a severity, it is a DATE: everything already present is
# recorded, and anything new fails the build at any severity. A new dependency
# that arrives with a known critical cannot merge. The existing 67 are visible,
# counted, and in one place instead of nowhere.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY IDS AND NOT PACKAGES
# ─────────────────────────────────────────────────────────────────────────────
# OSV-Scanner also offers `[[PackageOverrides]] ignore = true`, which would
# collapse these 67 entries into 26 and pin each to the exact version, so the
# entry lapses automatically on upgrade. It is smaller and it self-prunes, and it
# is still the wrong shape: silencing a PACKAGE also silences advisories that do
# not exist yet. A new CVE published against spring-webmvc 7.0.6 tomorrow would
# be swallowed. An id-based ignore cannot do that — it names one advisory, so the
# next one still fails the build. Bigger file, correct blast radius.
#
# The cost of the id form is that entries go stale rather than lapsing: once a
# package is upgraded its ids simply stop matching. Stale entries are inert (an
# id that matches nothing silences nothing), so this is untidiness, not risk.
# Re-record after any significant upgrade and they disappear.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO EMPTY MOST OF THIS FILE
# ─────────────────────────────────────────────────────────────────────────────
# The tree is not exotically vulnerable, it is behind. Roughly fifty of the ids
# below are one patch bump of the Spring Boot parent (4.0.5 -> 4.0.6 or later),
# which re-manages spring-*, tomcat-embed-*, jackson-*, netty-*, logback and
# thymeleaf in one move. The rest are five coordinates that carry explicit
# versions in pom.xml and can be bumped independently:
#
#     io.minio:minio                    8.5.14 -> 8.6.0
#     org.bitbucket.b_c:jose4j          0.7.9  -> 0.9.6
#     org.bouncycastle:bcprov-jdk18on   1.81   -> 1.84
#     org.bouncycastle:bcpkix-jdk18on   1.77   -> 1.84
#     org.apache.poi:poi-ooxml          5.3.0  -> 5.4.0
#
# ─────────────────────────────────────────────────────────────────────────────
# REGENERATING
# ─────────────────────────────────────────────────────────────────────────────
# The scan input is a CycloneDX SBOM produced by Maven itself (see ci.yml for
# why: Maven is the only resolver that honours the Shibboleth repository, the
# .mvn/rrf containment and the .mvn/checksums pinning). To re-record:
#
#   ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom #          -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false
#   osv-scanner scan source --lockfile target/bom.json --format json
#
# and rewrite the entries below from the result. Do not re-record casually: a
# blanket re-record is how a real new vulnerability gets baselined by accident.
# The comment above each group carries the fixed version, so the file doubles as
# the upgrade worklist.

