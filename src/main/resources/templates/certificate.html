<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Dosis', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #051647;
            width: 297mm;
            height: 210mm;
            overflow: hidden;
        }

        /* -----------------------------------------------------------------------
           Full-bleed navy background page

           Flying Saucer (9.4.0) implements CSS 2.1 only: no linear-gradient,
           no flexbox, no rgba(). Declarations using them are dropped silently,
           which is why this page used to render white with the white-on-navy
           text invisible. Everything below is deliberately CSS 2.1: a solid
           background-color, and table/table-cell for vertical centring.
        ----------------------------------------------------------------------- */
        .certificate-page {
            width: 297mm;
            height: 210mm;
            background-color: #051647;
            position: relative;
        }

        .content-table {
            display: table;
            width: 297mm;
            height: 210mm;
        }

        /* -----------------------------------------------------------------------
           Gold border frame
        ----------------------------------------------------------------------- */
        /* Sized explicitly rather than via right/bottom offsets: Flying Saucer
           does not resolve left+right (or top+bottom) into a width on absolutely
           positioned boxes, so these collapsed to a bare top edge. Page is
           297x210mm, so an Nmm inset gives (297-2N) x (210-2N). */
        .border-frame {
            position: absolute;
            top: 8mm;
            left: 8mm;
            width: 281mm;
            height: 194mm;
            border: 2px solid #d9ad62;
        }

        .border-frame-inner {
            position: absolute;
            top: 11mm;
            left: 11mm;
            width: 275mm;
            height: 188mm;
            /* was rgba(226,172,83,0.4) — pre-blended over the #051647 page */
            border: 1px solid #5d524c;
        }

        /* -----------------------------------------------------------------------
           Corner ornaments
        ----------------------------------------------------------------------- */
        .corner {
            position: absolute;
            width: 18mm;
            height: 18mm;
            border-color: #d9ad62;
            border-style: solid;
        }

        .corner-tl { top: 6mm;  left: 6mm;  border-width: 3px 0 0 3px; }
        .corner-tr { top: 6mm;  right: 6mm; border-width: 3px 3px 0 0; }
        .corner-bl { bottom: 6mm; left: 6mm;  border-width: 0 0 3px 3px; }
        .corner-br { bottom: 6mm; right: 6mm; border-width: 0 3px 3px 0; }

        /* -----------------------------------------------------------------------
           Content layout
        ----------------------------------------------------------------------- */
        .content-wrapper {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            padding: 20mm 24mm;
        }

        /* -----------------------------------------------------------------------
           Brand header
        ----------------------------------------------------------------------- */
        .brand-name {
            font-family: 'Dosis', sans-serif;
            font-size: 13pt;
            font-weight: 700;
            letter-spacing: 1px;
            color: #d9ad62;
            margin-bottom: 3mm;
        }

        .brand-tagline {
            font-family: 'Dosis', sans-serif;
            font-size: 7.5pt;
            font-weight: 400;
            letter-spacing: 3px;
            /* was rgba(226, 172, 83, 0.7), pre-blended over #051647 */
            color: #a07f4f;
            text-transform: uppercase;
            margin-bottom: 6mm;
        }

        /* -----------------------------------------------------------------------
           Certificate headline
        ----------------------------------------------------------------------- */
        .headline {
            font-family: 'Dosis', sans-serif;
            font-size: 8pt;
            font-weight: 600;
            letter-spacing: 5px;
            /* was rgba(255, 255, 255, 0.6), pre-blended over #051647 */
            color: #9ba2b5;
            text-transform: uppercase;
            margin-bottom: 3mm;
        }

        .divider-gold {
            width: 60mm;
            height: 2px;
            background: #d9ad62;
            margin: 0 auto 5mm;
        }

        /* -----------------------------------------------------------------------
           Learner name
        ----------------------------------------------------------------------- */
        .learner-name {
            font-family: 'Dosis', sans-serif;
            font-size: 28pt;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 5mm;
            letter-spacing: 1px;
        }

        /* -----------------------------------------------------------------------
           Award statement
        ----------------------------------------------------------------------- */
        .award-statement {
            font-family: 'Dosis', sans-serif;
            font-size: 9pt;
            font-weight: 400;
            /* was rgba(255, 255, 255, 0.75), pre-blended over #051647 */
            color: #c1c5d1;
            letter-spacing: 1px;
            margin-bottom: 2mm;
        }

        /* -----------------------------------------------------------------------
           Course title
        ----------------------------------------------------------------------- */
        .course-title {
            font-family: 'Dosis', sans-serif;
            font-size: 15pt;
            font-weight: 700;
            color: #d9ad62;
            line-height: 1.25;
            margin-bottom: 7mm;
            /* No max-width + auto margins: Flying Saucer will not centre a block
               that gets its width from max-width, which pushed the title a full
               left-padding off centre. Full width + inherited text-align does it. */
        }

        /* -----------------------------------------------------------------------
           Meta row (issued date + certificate number)
        ----------------------------------------------------------------------- */
        .meta-row {
            display: table;
            width: 160mm;
            margin: 0 auto;
        }

        .meta-cell {
            display: table-cell;
            width: 50%;
            text-align: center;
            vertical-align: middle;
            padding: 0 6mm;
        }

        .meta-label {
            font-family: 'Dosis', sans-serif;
            font-size: 6.5pt;
            font-weight: 600;
            letter-spacing: 3px;
            /* was rgba(226, 172, 83, 0.65), pre-blended over #051647 */
            color: #95784f;
            text-transform: uppercase;
            margin-bottom: 1.5mm;
        }

        .meta-value {
            font-family: 'Dosis', sans-serif;
            font-size: 9pt;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .meta-separator {
            display: table-cell;
            width: 1px;
            /* was rgba(226, 172, 83, 0.35), pre-blended over #051647 */
            background: #524b4b;
            vertical-align: middle;
        }

        /* -----------------------------------------------------------------------
           Bottom seal line
        ----------------------------------------------------------------------- */
        .seal-line {
            position: absolute;
            bottom: 16mm;
            left: 0;
            right: 0;
            text-align: center;
        }

        .seal-line-text {
            font-family: 'Dosis', sans-serif;
            font-size: 6pt;
            font-weight: 400;
            letter-spacing: 2px;
            /* was rgba(226, 172, 83, 0.45), pre-blended over #051647 */
            color: #685a4c;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<div class="certificate-page">

    <!-- Double border frame -->
    <div class="border-frame"></div>
    <div class="border-frame-inner"></div>

    <!-- Corner ornaments -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Main content. The table wrapper exists purely to give .content-wrapper a
         real table ancestor for vertical-align: middle — Flying Saucer's support
         for anonymous table boxes is unreliable, so the table is explicit. -->
    <div class="content-table">
    <div class="content-wrapper">

        <!-- Brand -->
        <div class="brand-name">Bvisionry</div>
        <div class="brand-tagline">Academy · Certificate of Completion</div>

        <!-- Headline + divider -->
        <div class="headline">This is to certify that</div>
        <div class="divider-gold"></div>

        <!-- Learner -->
        <div class="learner-name" th:text="${learnerName}">Learner Name</div>

        <!-- Award statement -->
        <div class="award-statement">has successfully completed the course</div>

        <!-- Course title -->
        <div class="course-title" th:text="${courseTitle}">Course Title</div>

        <!-- Meta row -->
        <div class="meta-row">
            <div class="meta-cell">
                <div class="meta-label">Date of Issue</div>
                <div class="meta-value" th:text="${issuedAtFormatted}">
                    January 1, 2026
                </div>
            </div>
            <div class="meta-separator"></div>
            <div class="meta-cell">
                <div class="meta-label">Certificate No.</div>
                <div class="meta-value" th:text="${certificateNumber}">BV-2026-XXXXXX</div>
            </div>
        </div>

    </div>
    </div>

    <!-- Seal line -->
    <div class="seal-line">
        <span class="seal-line-text">
            Verify this certificate at bvisionry.com/verify
            &#160;·&#160;
            <span th:text="${certificateNumber}">BV-2026-XXXXXX</span>
        </span>
    </div>

</div>
</body>
</html>
