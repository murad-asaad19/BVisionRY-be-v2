# Bvisionry — agent policy record
#
# The graph's constitution. Every agent reads THIS, not the roadmap narrative.
# Judgement lives here so it never has to happen mid-run.
#
# Rules:
#   - Decisions below are CLOSED. Do not re-litigate, re-argue, or "improve" them.
#   - Ambiguity outside them: see `on_ambiguity` — decide, log, keep going.
#     EXCEPT for `never_auto_decide`, which always parks.
#   - Only a human amends this file. AMENDMENT LOG:
#       2026-07-26 — operator DELEGATED ruling authority for parked `never_auto_decide`
#       items to the orchestrator (advised by an independent reviewer, decision recorded
#       in agent-decisions.md before implementation). Under that delegation:
#         · decisions.i18n.new_surfaces_use_next_intl  true -> false (SUSPENDED + trigger)
#         · defaults.new_ui_copy   ENGLISH_VIA_NEXT_INTL -> PLAIN_ENGLISH
#       Delegation is NOT standing: it covers the four items parked as of that date.
#       Anything new still parks unless the operator delegates it too.
#       2026-07-27 — operator ruled on all EIGHT open decisions after a research pass
#       that falsified several premises the recommendations rested on (two of the
#       operator's first four answers were reversed on the evidence and re-put).
#       Full rulings + the corrections in agent-decisions.md → "OPERATOR RULINGS".
#       Amendment made under that session: hard_constraints never_write →
#       never_add_lines on the frozen-violations store (see the clause for why).
#
# Rationale: docs/roadmap.md §14   Execution: docs/agent-execution-graph.md
# Decisions made during a run are appended to docs/agent-decisions.md

version: 3
revised: 2026-07-25
# v3 — closed two gaps the first unattended run hit on its first ticket:
#   · autonomy_prerequisites was referenced by scheduler_rules but did not exist
#   · Gate 5 was unsatisfiable (no ticket could write the tests Gate 1 demands or
#     the decision entry on_ambiguity demands) and unevaluable for the 21 of 24
#     tickets that declare no scope globs

# ---------------------------------------------------------------------------
# Run mode — unattended
# ---------------------------------------------------------------------------
run_mode:
  unattended: true                    # operator is AFK; never wait for input

  git: LOCAL_COMMITS_ONLY
  # Commit freely on the working branch. NEVER push, never open a PR, never
  # merge to staging or main, never touch a remote. The operator reviews the
  # local commit stack on return.
  push: false
  merge_to_staging: false

  on_ambiguity: DECIDE_AND_LOG
  # Pick the most defensible option, append an entry to docs/agent-decisions.md
  # (what was ambiguous, options considered, choice, why, how to reverse), and
  # continue. Do not stall. Do not ask.

  # Bounded effort per ticket, then park and move on.
  max_gate_failures_per_ticket: 3
  max_consecutive_parks: 5            # more than this = something systemic; stop

  commit_granularity: PER_TICKET      # not per action

  # Concurrency. Every parallel agent claims its own runtime lane before doing
  # anything — sharing one produces Flyway divergence, cache bleed and port
  # clashes, none of which attribute to a cause during an unattended run.
  max_parallel_agents: 4
  lane_claim: "bash docker/sandbox/sandbox.sh up <n>"        # n = 1..4, one per agent
  lane_env:   "set -a; source docker/sandbox/agent-<n>.env; set +a"
  lane_reset: "bash docker/sandbox/sandbox.sh reset <n>"     # this lane only
  # Each lane is a SEPARATE compose project — its own Postgres, Redis, MinIO and
  # Mailpit containers and volumes. Sharing a runtime would produce Flyway
  # divergence, cache bleed and port clashes, none of which attribute to a cause
  # during an unattended run. Separate containers also make a stray FLUSHALL or
  # a dropped bucket impossible to inflict on another lane rather than merely
  # discouraged.
  lane_isolates: [postgres, redis, minio, mailpit, api_port, web_port]

  # A lane isolates the RUNTIME. It does not isolate FILES — two agents in two
  # worktrees can still edit the same pom.xml or package.json, and under
  # LOCAL_COMMITS_ONLY that conflict never surfaces during the run. It lands on
  # the operator as a conflicted stack. So:
  scheduler_rules:
    - "one active ticket per `zone` — never two at once, regardless of free lanes"
    - "a ticket is eligible only when every id in depends_on is done"
    - "no phase > 0 ticket starts until all autonomy_prerequisites are true"
    - "zone `readonly` is exempt from exclusivity — it writes nothing"
  # Consequence, and it is expected: Phase 0 is mostly SERIAL (four of its five
  # tickets are zone `platform` and share build files). Real parallelism starts
  # at Phase 2. Idle lanes early are correct, not a bug to schedule around.
  lane_ports: "lane n → pg 5433+n · redis 6380+n · s3 9002+2n · mail 8026+n · api 8180+n · web 3010+n"
  # Lane 0 is the manual/inspection lane. Agents take 1..4.

# ---------------------------------------------------------------------------
# Autonomy prerequisites — the evidence layer, referenced by scheduler_rules
# ---------------------------------------------------------------------------
# Removing the human removed three functions: browser validation, "production
# looks wrong", and judging whether a diff is in scope. These are their
# replacements (execution-graph §1). Until they are true, a green build says
# almost nothing about the surface most tickets touch — so no phase > 0 ticket
# may start. They are the run's own first work, not a separate human phase.
#
# Each flag is the ticket of the same name having LANDED with every applicable
# gate green. An agent flips a flag only after committing that ticket, and
# records the commit sha in docs/agent-run-report.md next to it. A flag is a
# statement about evidence that exists, never about work believed to be nearly
# done: if the ticket parked, the flag stays false.
autonomy_prerequisites:
  error_tracking: true              # the regression signal — landed 5e076b1 (be) + 50a2cc0 (web), gates observed by orchestrator, 3/3 veto lenses PASS
  e2e_local_green: true             # LANDED web 7c0a57b — 89/89 twice, orchestrator-observed on the seeded lane; both validators PASS
  diff_coverage_and_lint_gate: true # LANDED be ee56126 + web 34b47b7 — READ NARROWLY: backend changed lines + web .ts changed lines + blocking lint; .tsx (84% of web churn) stays on Gate 4 evidence until sweep_fe_test_backfill adds a component coverage project
  scope_manifest_gate: false        # a diff that wandered gets caught

# ---------------------------------------------------------------------------
# Things that NEVER get auto-decided — these park regardless of on_ambiguity
# ---------------------------------------------------------------------------
never_auto_decide:
  - "anything under `never_touch` below"
  - "contraction migrations — any DROP, RENAME, or type narrowing (irreversible)"
  - "deleting or anonymising user data beyond a specified GDPR delete flow"
  - "changing any decision in `decisions` below"
  - "auth model changes beyond what a ticket specifies: token semantics, session handling, the RBAC model itself"
  - "adding a third-party dependency that transmits user data off-box"
  - "anything that changes what a customer is charged or promised"

# ---------------------------------------------------------------------------
# Product identity — the most common source of drift
# ---------------------------------------------------------------------------
product:
  # We sell a MEASUREMENT INSTRUMENT priced per cohort, not an LMS priced per seat.
  is: "Founder Readiness Index — cohort-priced assessment instrument"
  is_not: "a learning management system"
  # Learning content ships only in the top tier. Two of three tiers have none.
  unit_of_value: MEASURED_COHORT
  vertical: ACCELERATOR_FIRST          # §14.7
  # Entering the enterprise-L&D roadmap by accident is the failure mode.
  never_add: [SCORM, xAPI, AICC, HRIS_INTEGRATION]

# ---------------------------------------------------------------------------
# Closed decisions — roadmap §14
# ---------------------------------------------------------------------------
decisions:
  roles:
    coach_separate_from_instructor: true      # §14.1 — two roles, different data scopes
    manager: DELETE                           # §14.2 — migrate holders to MEMBER
  calendar: INTEGRATE_CAL_COM                 # §14.3 — never build native booking
  i18n:
    scope: UI_CHROME_ONLY                     # §14.4 — never translate course content
    new_surfaces_use_next_intl: false         # SUSPENDED 2026-07-26 (operator-delegated
                                              # ruling) — English-only until the trigger
                                              # below fires. Grounds: the clause was
                                              # structurally unimplementable (next-intl
                                              # install needs web/package.json, a
                                              # serialising platform path no feature
                                              # ticket may claim), and its stated purpose
                                              # ("stop the bill growing now") had already
                                              # failed — ~2,000+ hardcoded strings landed
                                              # regardless. See agent-decisions.md.
    reactivation_trigger: >-
      A signed customer commitment or committed launch market requiring a non-English
      locale, OR the operator schedules the Phase-4 i18n retrofit with a date. On trigger:
      (1) one serialising platform ticket installs next-intl, wires next.config.ts and the
      provider, and converts one exemplar route; (2) a ux_p0-shaped fan-out sweep extracts
      the remaining strings, gated by e2e. Shipped tickets are grandfathered; do not
      retrofit ahead of the trigger.
  white_label:
    logo: true
    colors: true
    custom_domain: false                      # §14.5
    branded_email_sender: false
  communications: ANNOUNCEMENTS_ONLY          # §14.6 — no threads, no DMs

# ---------------------------------------------------------------------------
# Pre-answered design questions — so tickets don't have to park or guess.
# These are defaults, not constraints: a ticket with a better-informed reason
# may deviate, log it, and proceed.
# ---------------------------------------------------------------------------
defaults:
  coach_assignment_grain: COHORT_AND_DIRECT
  # A coach may be assigned to a whole cohort AND to individual founders.
  # Union of both defines visibility.

  coach_sees: [pillar_scores, module_progress, submissions, reflections, completion_pct]
  coach_never_sees: [other_cohorts, billing, org_settings, platform_analytics]

  roi_report_contains:
    - cohort pillar averages at intake vs latest
    - per-pillar delta with direction
    - per-founder delta table
    - completion rate across assigned modules
    - cohort size, date range, program name
  roi_report_formats: [PDF, XLSX]     # both already exist as infrastructure
  roi_report_audience: FUNDER          # presentable outside the org, brandable

  benchmark_segment_by: [cohort, org, platform_wide]
  benchmark_min_sample: 30            # below this, show "insufficient data", never a number
  benchmark_anonymity: AGGREGATE_ONLY # never expose another org's founders or org identity

  competency_matrix_axes: [pillar, maturity_band]
  competency_movement_window: ALL_ASSESSMENTS   # show full history, not just latest two

  inactivity_threshold_days: 14       # org-configurable, this is the default
  nudge_channels: RESPECT_EXISTING_PREFERENCES

  announcement_targets: [cohort]      # not org-wide, not individual
  announcement_body: PLAIN_TEXT_PLUS_LINKS   # rich text later, sanitizer applies now

  auto_enrolment_idempotency_key: [founder_id, course_id, source_evaluation_id]
  auto_enrolment_on_reassessment: NEW_ENROLMENTS_ONLY  # never duplicate, never unenrol
  auto_enrolment_explains_why: true   # founder always sees the triggering pillar

  empty_state_rule: EVERY_EMPTY_STATE_NAMES_A_NEXT_ACTION
  new_ui_copy: PLAIN_ENGLISH          # aligned with the suspended i18n decision (2026-07-26).
                                      # Hardcoded English is COMPLIANT, not a deviation —
                                      # stop logging per-ticket i18n deviations.

# ---------------------------------------------------------------------------
# Delivery order — roadmap §12. The graph does not reorder the business case.
# A ticket is eligible when every id in depends_on is done.
# ---------------------------------------------------------------------------
backlog:

  # -- Phase 0 · autonomy gates + live compliance claim -----------------------
  - id: error_tracking
    zone: platform
    phase: 0
    radius: S
    outcome: "Unhandled exceptions from backend and web are aggregated and queryable. A deliberately thrown test error is visible from both."
    scope: ["backend/src/main/**", "backend/pom.xml", "web/src/**", "web/package.json", "web/next.config.ts"]
    depends_on: []

  - id: e2e_local_green
    zone: platform
    phase: 0
    radius: M
    outcome: "The existing Playwright specs run and pass locally against the sandbox stack. This is the frontend's only real evidence at ~2% coverage."
    note: "Get it green LOCALLY first — that is the evidence. CI wiring may be committed but cannot be verified under LOCAL_COMMITS_ONLY."
    scope: ["web/e2e/**", "web/playwright.config.*", "web/package.json", ".github/workflows/**"]
    depends_on: []

  - id: diff_coverage_and_lint_gate
    zone: platform
    phase: 0
    radius: S
    outcome: "Coverage is enforced on changed lines (~70%), and lint is blocking for web. Pre-existing lint errors fixed."
    note: "Do NOT raise the global JaCoCo floor — roadmap §11."
    scope: ["backend/pom.xml", "web/package.json", "web/eslint.config.*", ".github/workflows/**", "web/src/**"]
    depends_on: []

  - id: scope_manifest_gate
    zone: platform
    phase: 0
    radius: S
    outcome: "A check fails when a ticket's diff touches files outside its declared scope globs."
    depends_on: []

  - id: gdpr_export_delete
    zone: auth
    phase: 0
    radius: M
    outcome: "A user can export their data and delete their account. The pricing FAQ already claims compliance."
    depends_on: []

  # -- Phase 1 · unblocks GROWTH $599 -----------------------------------------
  - id: coach_console
    zone: coaching
    phase: 1
    radius: L
    outcome: "roadmap §7 item 4 — sold as the Growth 'Mentor/Organization access portal'."
    note: "Spine ticket: introduces COACH, removes MANAGER. Single writer, expand-contract. Highest scrutiny."
    depends_on: [error_tracking, e2e_local_green, diff_coverage_and_lint_gate]

  - id: quantitative_benchmarking
    zone: insights
    phase: 1
    radius: M
    outcome: "roadmap §7 item 19 — real cross-tenant distribution, not an AI narrative."
    depends_on: [coach_console]

  - id: founder_dashboard
    zone: webapp
    phase: 1
    radius: M
    outcome: "roadmap §7 item 3 — role-aware home."
    depends_on: [error_tracking, diff_coverage_and_lint_gate]

  # -- Phase 2 · unblocks FOUNDER SUCCESS -------------------------------------
  - id: authoring_honesty
    zone: catalog
    phase: 2
    radius: S
    outcome: "roadmap §7 item 1 — remove lesson types with no player runtime."
    depends_on: [diff_coverage_and_lint_gate]

  - id: roi_reporting
    zone: insights
    phase: 2
    radius: M
    outcome: "roadmap §7 item 16 — the renewal driver. See defaults.roi_report_*."
    depends_on: [quantitative_benchmarking]

  - id: competency_matrix
    zone: webapp
    phase: 2
    radius: S
    outcome: "roadmap §7 item 17 — 11 pillars as a mastery matrix."
    depends_on: [founder_dashboard]

  - id: courses_qa_and_flag
    zone: catalog
    phase: 2
    radius: S
    outcome: "roadmap §7 item 11 — full QA across every lesson type, then flip the flag."
    depends_on: [authoring_honesty, e2e_local_green]

  - id: announcements
    zone: communication
    phase: 2
    radius: M
    outcome: "roadmap §7 item 20 — cohort broadcast. Announcements only."
    depends_on: [coach_console]

  - id: inactivity_and_proactive_nudges
    zone: notification
    phase: 2
    radius: S
    outcome: "roadmap §7 items 7 + 18 — inactivity trigger and a proactive AI coach."
    depends_on: [courses_qa_and_flag]

  - id: ux_p0
    zone: webapp
    phase: 2
    radius: S
    outcome: "roadmap §10 P0 1–4 — next-lesson CTA, breadcrumbs, role-aware home, no dead-end empty states."
    note: "Sweep-shaped. Fan out per page; one rule per agent."
    depends_on: [founder_dashboard, courses_qa_and_flag]

  # -- Phase 3 · contractual ---------------------------------------------------
  - id: pillar_course_mapping
    zone: assessment
    phase: 3
    radius: M
    outcome: "roadmap §7 item 9 — admin declares pillar → module at score band."
    depends_on: [competency_matrix]

  - id: auto_enrolment
    zone: assessment
    phase: 3
    radius: L
    deadline: 2027-06-30
    outcome: "roadmap §7 item 10 — sold as 'Personalized learning journeys'. See defaults.auto_enrolment_*."
    note: "Single agent, sequential. Do NOT fan out — high blast radius, writes enrolments for real users."
    depends_on: [pillar_course_mapping, courses_qa_and_flag]

  - id: dashboard_recommendations
    zone: webapp
    phase: 3
    radius: S
    outcome: "Results and dashboard surface recommended/assigned modules with the reason."
    depends_on: [auto_enrolment]

  # -- Sweeps · wide, shallow, gate-verified. Fan out freely. ------------------
  - id: sweep_preauthorize_audit
    zone: readonly
    phase: 2
    radius: S
    outcome: "Every controller's authorization reviewed; findings reported. Read-only fan-out."
    depends_on: [coach_console]

  - id: sweep_fe_test_backfill
    zone: webtests
    phase: 2
    radius: S
    outcome: "Frontend coverage raised from ~2%, verified by the diff-coverage gate."
    depends_on: [diff_coverage_and_lint_gate]

  - id: sweep_route_boundaries
    zone: webroutes
    phase: 2
    radius: S
    outcome: "error.tsx / loading.tsx across the app route tree."
    depends_on: [diff_coverage_and_lint_gate, e2e_local_green]

  # -- Phase 4 · expansion. Attempt only if everything above is done. ----------
  - id: saml_oidc_sso
    zone: auth
    phase: 4
    radius: L
    depends_on: [coach_console]
  - id: calendar_integration
    zone: coaching
    phase: 4
    radius: M
    outcome: "Integrate a provider. Never build booking."
    depends_on: [coach_console]
  - id: white_label_theming
    zone: webapp
    phase: 4
    radius: L
    outcome: "Logo + palette only. No custom domain, no branded sender."
    depends_on: [founder_dashboard]

# ---------------------------------------------------------------------------
# NOT agent work — park immediately with a note, never attempt
# ---------------------------------------------------------------------------
human_only:
  - "Engage a SOC 2 auditor / open the observation window"
  - "Order the VPAT / ACR accessibility audit"
  - "Brief sales on the deliverable-today list (roadmap §3)"
  - "Engineering hire"

# ---------------------------------------------------------------------------
# Hard constraints — violating any of these parks the ticket
# ---------------------------------------------------------------------------
hard_constraints:

  # An ArchUnit failure means REDESIGN THE DEPENDENCY or park. Adding a violation
  # here turns a design error into permanent, silent debt and greens the build.
  #
  # AMENDED 2026-07-27 (operator-directed): `never_write` -> `never_add_lines`.
  # As written the clause was UNSATISFIABLE. Gate 1 is `./mvnw test`, and
  # FreezingArchRule PRUNES this store whenever a developer legitimately removes a
  # violation (`allowStoreUpdate=true`) — so running the mandatory gate could
  # itself breach the hard constraint, and did: a validator watched the suite
  # silently drop ~20 lines mid-run. Setting allowStoreUpdate=false was considered
  # and REJECTED: new violations already fail via filterOutKnownViolations (the
  # flag is not the ratchet), it would hard-fail every legitimate cleanup, and it
  # breaks the documented `refreeze` escape. 8 of the last 150 commits touched
  # this store and all 8 contained deletions.
  # The direction that matters is ADDITIONS — a violation added by hand to green a
  # build. Pruning is the ratchet working. Enforced in CI by a diff guard modelled
  # on the existing "Forbid edits to committed Flyway migrations" step.
  - never_add_lines: "backend/src/test/resources/architecture/frozen-violations/**"

  # Money path and public pricing claims.
  - never_touch:
      - "web/src/app/(marketing)/pricing/**"
      - "web/src/lib/founder-content.ts"

  # Flyway is append-only and immutable; code reverts, applied schema does not.
  # Migrations may ADD columns/tables/nullable fields. They may NEVER drop,
  # rename, or narrow a type in the same release as the code depending on it.
  - migrations: EXPAND_CONTRACT_ONLY
  - migrations_single_writer: true            # numbering is a mutex — never parallel
  - never_edit_committed_migration: true

  # Tenant scoping is mandatory. Bare findById on org-owned repos only inside
  # require* guard methods.
  - tenant_scoping: MANDATORY_ON_NEW_ENDPOINTS

  # After any DTO change: OpenApiExportTest -> pnpm gen:api -> typecheck.
  - contract_pipeline: MANDATORY_ON_DTO_CHANGE

  # Agents work in their OWN lane. Never :5432 (dev) and never lane 0 (the
  # operator's manual/inspection lane) — take a lane in 1..max_parallel_agents.
  # The connection details come from the generated lane env file; no port is
  # ever hardcoded in a ticket.
  - database: SANDBOX_LANE_ONLY
  - runtime_isolation: ONE_LANE_PER_AGENT     # worktree pair AND lane, claimed together
  - never_connect: [":5432 — dev", "lane 0 — operator's lane"]

# ---------------------------------------------------------------------------
# Scope — what Gate 5 actually evaluates
# ---------------------------------------------------------------------------
# Gate 5 is the cheapest control in the graph and catches the widest class of
# autonomous drift, but "diff ⊆ the ticket's scope globs" alone is not runnable:
# it contradicts two other rules, and 21 of the 24 backlog tickets declare no
# globs at all. Both holes are closed here.
scope:

  # (1) Paths EVERY ticket may touch, no declaration needed.
  #
  # Without these Gate 5 contradicts Gate 1 — which requires tests — and
  # on_ambiguity, which requires appending a decision entry. No backlog ticket
  # lists either path, so a ticket obeying one rule necessarily violated the
  # other, and the first ticket of the run hit this.
  always_in_scope:
    - "backend/src/test/**"                 # but only mirroring an in-scope backend/src/main/**
    - "web/src/**/*.test.ts"                # ditto for the web tree
    - "web/src/**/*.test.tsx"
    - "backend/docs/agent-decisions.md"     # on_ambiguity REQUIRES writing this
    - "backend/docs/agent-run-report.md"    # the run's live state, written on finish
  # Deliberately NOT here: agent-policy.yml and agent-execution-graph.md. The
  # constitution and the design are human-amended; an agent that can edit its own
  # constraints has none.

  # (2) A ticket with no `scope:` key still gets a manifest — it is written at
  # intake, BEFORE any code, and recorded in agent-run-report.md so Gate 5 has
  # something to check against and the operator can see what was claimed.
  undeclared: DECLARE_AT_INTAKE
  # An intake-declared manifest is bounded, not free. It may never:
  #   - include anything under hard_constraints.never_touch
  #   - include agent-policy.yml or agent-execution-graph.md
  #   - reach outside the paths the ticket's `zone` owns, so two zones running in
  #     parallel cannot both claim the same file (the reason zones exist)
  # Widening a manifest mid-ticket is a scope change: log it in
  # agent-decisions.md with what was added and why, or park.

  # (3) Shared build files are the collision zones exist to prevent. A ticket
  # whose manifest includes one of these blocks every other ticket that also
  # needs it, regardless of free lanes — treat it as zone `platform` for
  # scheduling even if the ticket names another zone.
  serialising_paths:
    - "backend/pom.xml"
    - "web/package.json"
    - "web/eslint.config.*"
    - "web/next.config.ts"
    - "web/playwright.config.*"
    - ".github/workflows/**"

  # (4) Migration numbering is a mutex (execution-graph §7). At most ONE ticket
  # may hold a manifest containing this glob at a time, and it must record the
  # version it took in agent-run-report.md the moment it takes it.
  migration_single_writer_path: "backend/src/main/resources/db/migration/**"

# ---------------------------------------------------------------------------
# Gates — the evidence bar. All run locally; no remote CI under LOCAL_COMMITS_ONLY.
# A ticket is done only when every applicable gate is green.
# ---------------------------------------------------------------------------
gates:
  - id: 1_backend
    run: "cd backend && ./mvnw test"
    covers: [compile, ArchUnit, tenant-scoping rule, unit + integration tests]
  - id: 2_contract
    run: "backend OpenApiExportTest, then `pnpm gen:api` in web, then `pnpm typecheck`"
    when: DTO_CHANGED
  - id: 3_web
    run: "cd web && pnpm lint && pnpm typecheck && pnpm test"
  - id: 4_e2e
    run: "cd web && pnpm e2e"
    when: FRONTEND_CHANGED
    requires:
      - "your lane is up (sandbox.sh up <n>) and its env is sourced"
      - "the backend is running on the lane's SERVER_PORT"
      - "`pnpm dev --port $PORT` is running — playwright.config has NO webServer by design"
    note: >
      The frontend's primary evidence at ~2% unit coverage. baseURL comes from
      E2E_BASE_URL in the lane env. Never override it and never point e2e at a
      server you did not start: aimed elsewhere it exercises another process and
      still reports green, which is the exact failure this gate exists to catch.
  - id: 5_scope
    # Plain ASCII on purpose: this string gets printed by tooling, and a Windows
    # cp1252 console raises UnicodeEncodeError on set-notation glyphs.
    run: "diff must be a subset of (the ticket's `scope` globs, or its intake-declared manifest) plus scope.always_in_scope"
    note: >
      See the `scope` block above. A ticket with no declared globs is NOT
      unconstrained — it declares a manifest at intake and Gate 5 checks that.
      Out-of-scope diff parks the ticket; it is never waved through.

# ---------------------------------------------------------------------------
# Review authority
# ---------------------------------------------------------------------------
validators:
  veto:                          # absolute — no override mechanism exists
    - tenant_scoping
    - rbac_and_three_layer_defense
    - policy_compliance
  advisory:
    - contract_and_migration
    - performance_n_plus_one
    - ux_conventions
  # Validators receive diff + spec + this file. Never the implementer's reasoning.
  context: [diff, ticket_spec, agent_policy]

# ---------------------------------------------------------------------------
# Known-stale facts worth fixing when touched (not tickets in themselves)
# ---------------------------------------------------------------------------
known_issues:
  - "web pricing components reference a non-existent fri-enterprise tier and 'Enterprise & Add-Ons' section"
  - "Growth tier feature list reads 'Up to 1 cohorts/month' — but pricing files are never_touch; report, don't edit"
  - "ContentType enum has SCORM, WEBPAGE, ARTICLE with no player runtime"
  - "MANAGER role is declared and assignable but grants no authorities"
