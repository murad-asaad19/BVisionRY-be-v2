name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flyway migrations are immutable and append-only: their checksums are
      # recorded in every environment's flyway_schema_history, so editing or
      # deleting an already-committed V*.sql breaks the next migrate. Fail fast
      # here instead. New migration files (added) are fine.
      - name: Forbid edits to committed Flyway migrations
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            RANGE="$(git merge-base "$BASE" HEAD)..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No base commit to compare (new branch push) — skipping."
              exit 0
            fi
            RANGE="$BEFORE..HEAD"
          fi
          CHANGED=$(git diff --diff-filter=MDR --name-only "$RANGE" -- 'src/main/resources/db/migration/V*.sql' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::Committed Flyway migrations were modified, renamed, or deleted (immutable, append-only):"
            echo "$CHANGED"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw is committed without the executable bit (developed on Windows),
      # so restore it before invoking the wrapper on the Linux runner.
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Docker is available on ubuntu-latest, so Testcontainers (postgres:16-alpine) runs here.
      - name: Build and verify
        run: ./mvnw -B verify
